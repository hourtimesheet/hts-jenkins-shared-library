[versions]
commonLang3 = "3.20.0"
# Groovy 3.0.x is the minimum that can compile sources whose dependency JARs
# are JDK 17 bytecode (class file major 61). The previous 2.5.14 fails with
# "Unsupported class file major version 61" on jenkins-core 2.440.3 + JDK 17.
# Spock's matching variant (`2.3-groovy-3.0`) is wire-compatible with the
# existing Spock specs (no source changes required). Closes #5.
groovy = "3.0.25"
jenkin = "2.567"
spock = "2.3-groovy-3.0"
junit = "6.0.3"

[libraries]
apache-commonlang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commonLang3" }
groovy             = { module = "org.codehaus.groovy:groovy-all", version.ref = "groovy" }
jenkin-core        = { module = "org.jenkins-ci.main:jenkins-core", version.ref = "jenkin" }
spock-core         = { module = "org.spockframework:spock-core", version.ref = "spock" }
junit-jupiter      = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
