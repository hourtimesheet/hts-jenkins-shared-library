name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Audit finding M4: cancel superseded runs on the same branch / PR so a
# rapid-fire push sequence doesn't queue redundant Gradle builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Audit finding M4: hard cap on a runaway build (Gradle download stalls,
    # daemon hangs, etc.). 15 min is comfortably above a normal cold-start.
    timeout-minutes: 15
    steps:
      # Audit finding L5: third-party action versions are a supply-chain risk
      # via tag-mutation. Pinning to commit SHAs keeps these reproducible.
      # The comment after each SHA is the human-readable tag at pin time.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 17
        # Toolchain pinned to Java 17 here AND in build.gradle.kts — Jenkins
        # 2.452+ (LTS, 2024-04-23+) requires JDK 17 on the controller and
        # recommends it on agents. The two pin sites are a sync-pair: bump
        # both together (closes #5).
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'

      # Audit finding M5: validate the Gradle wrapper JAR before invoking it.
      # gradle/actions/wrapper-validation pins the expected SHA-256 of the
      # bundled gradle-wrapper.jar against the published checksums.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Run tests
        run: ./gradlew --no-daemon test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: build/reports/tests/
          if-no-files-found: ignore
